name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install.sh install-all.sh install-browser-tor.sh test-*.sh

      - name: docker compose config (profile full)
        run: |
          cp .env.example .env
          docker compose --profile full config -q

      - name: py_compile (router + plugins)
        run: python3 -m py_compile camofox/router/*.py plugins/*/__init__.py

      - name: router tests (fake backend)
        run: |
          pip install -q fastapi httpx
          cd camofox/router && python3 test_router_dead_tabs.py

      - name: build router image
        run: docker build camofox/router

      - name: build patched camofox image
        run: docker build camofox
  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install test deps
        run: pip install -q pytest requests

      - name: plugin URL validation tests
        run: pytest tests/ -v
