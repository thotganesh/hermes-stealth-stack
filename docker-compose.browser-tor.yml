# Optional: the container behind the browser_tor plugin.
# Needs a tor-proxy whose ControlPort (9151) uses the same password as TOR_CONTROL_PASSWORD.
services:
  browser-tor:
    build: ./browser-tor
    container_name: browser-tor
    restart: unless-stopped
    networks: [stealth-net]
    environment:
      TOR_CONTROL_PASSWORD: "${TOR_CONTROL_PASSWORD:?set TOR_CONTROL_PASSWORD in .env}"
      TOR_REQUIRE_NEWNYM: "${TOR_REQUIRE_NEWNYM:-0}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  stealth-net:
    name: ${DOCKER_NETWORK:-ai-net}
    external: true
