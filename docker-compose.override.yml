x-camofox: &camofox
  image: hermes-stealth/camofox:1.0.3
  build:
    context: ./camofox
    args:
      BASE_IMAGE: ${CAMOFOX_IMAGE:-ghcr.io/jo-inc/camofox-browser:latest}
  shm_size: "1gb"
  mem_limit: 2g

services:
  camofox:
    <<: *camofox
  camofox-tor:
    <<: *camofox
    environment:
      # Circuiti Tor dedicati: separati da browser-tor (ai-stack).
      # Vedi ai-stack/docker-compose.yml -> tor-proxy-camofox.
      PROXY_HOST: "tor-proxy-camofox"
      PROXY_PORT: "9150"
      PROXY_PROTOCOL: "socks5"
  camofox-i2p:
    <<: *camofox
    labels:
      - autoheal=true
    healthcheck:
      # Verifica che il container sia vivo (browser avviato, HTTP risponde,
      # tab si crea). NON testa la raggiungibilita' di I2P: dipende da
      # tunnel esterni lenti e farebbe fallire il check anche quando
      # camofox-i2p e' sano. Il target e' il proxy i2pd locale, che risponde
      # subito senza costruire tunnel.
      test: ["CMD-SHELL", "node -e 'const http=require(\"http\");const body=JSON.stringify({userId:\"hc\",sessionKey:\"hc\",url:\"http://i2p-proxy:4444/\"});const req=http.request({host:\"127.0.0.1\",port:9377,path:\"/tabs\",method:\"POST\",headers:{\"Content-Type\":\"application/json\",\"Content-Length\":body.length}},res=>{let d=\"\";res.on(\"data\",c=>d+=c);res.on(\"end\",()=>{try{const j=JSON.parse(d);process.exit(j.tabId?0:1)}catch(e){process.exit(1)}})});req.on(\"error\",()=>process.exit(1));req.setTimeout(20000,()=>{req.destroy();process.exit(1)});req.write(body);req.end()'"]
      interval: 5m
      timeout: 25s
      retries: 2
      start_period: 90s
  camofox-router:
    environment:
      ROUTER_API_KEY: "${ROUTER_API_KEY:-}"
      ROUTER_DEFAULT_BACKEND: "${ROUTER_DEFAULT_BACKEND:-vps}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9378/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  searxng:
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "30"
      AUTOHEAL_START_PERIOD: "120"
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
